# ═══════════════════════════════════════════════════════════════════════════════
# Nginx config — Tilak Global School
# Public site  → tilakglobalschool.in      (Next.js on port 3000)
# Admin panel  → admin-portal.tilakglobalschool.in  (Next.js on port 3001)
# Backend API  → internal only             (Express on port 5000)
#
# Prerequisites:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d tilakglobalschool.in -d www.tilakglobalschool.in
#   sudo certbot --nginx -d admin-portal.tilakglobalschool.in
# ═══════════════════════════════════════════════════════════════════════════════

# ── Rate limiting zones ──────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=public_limit:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=admin_limit:10m   rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m     rate=20r/s;

# ── Redirect HTTP → HTTPS ────────────────────────────────────────────────────
server {
    listen      80;
    server_name tilakglobalschool.in www.tilakglobalschool.in
                admin-portal.tilakglobalschool.in;
    return 301  https://$host$request_uri;
}

# ══════════════════════════════════════════════════════════════════════════════
# PUBLIC WEBSITE — tilakglobalschool.in
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen      443 ssl http2;
    server_name tilakglobalschool.in www.tilakglobalschool.in;

    # SSL — filled in by Certbot
    ssl_certificate     /etc/letsencrypt/live/tilakglobalschool.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tilakglobalschool.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"               always;
    add_header X-Content-Type-Options    "nosniff"                  always;
    add_header X-XSS-Protection          "1; mode=block"            always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Block direct access to /admin on the public domain → hard 404
    location /admin {
        return 404;
    }

    # Static Next.js assets — long cache
    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_cache_valid  200 60m;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    # Public API proxy → Express backend
    location /api/ {
        limit_req          zone=api_limit burst=40 nodelay;
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Serve uploaded files directly
    location /uploads/ {
        alias              /var/www/tilak-school/backend/uploads/;
        expires            30d;
        add_header         Cache-Control "public, max-age=2592000";
    }

    # Public site — all other requests
    location / {
        limit_req          zone=public_limit burst=50 nodelay;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ══════════════════════════════════════════════════════════════════════════════
# ADMIN PANEL — admin-portal.tilakglobalschool.in
# ══════════════════════════════════════════════════════════════════════════════
server {
    listen      443 ssl http2;
    server_name admin-portal.tilakglobalschool.in;

    # SSL — filled in by Certbot
    ssl_certificate     /etc/letsencrypt/live/admin-portal.tilakglobalschool.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin-portal.tilakglobalschool.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers — stricter for admin
    add_header X-Frame-Options           "DENY"                     always;
    add_header X-Content-Type-Options    "nosniff"                  always;
    add_header X-XSS-Protection          "1; mode=block"            always;
    add_header Referrer-Policy           "no-referrer"              always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Block indexing by search engines
    add_header X-Robots-Tag              "noindex, nofollow"        always;

    # Block direct server-IP access attempts
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    # Admin API proxy → Express backend
    location /api/ {
        limit_req          zone=api_limit burst=20 nodelay;
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cookie_domain localhost admin-portal.tilakglobalschool.in;
    }

    # Static Next.js assets
    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_cache_valid  200 60m;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    # Serve uploaded files
    location /uploads/ {
        alias              /var/www/tilak-school/backend/uploads/;
        expires            30d;
    }

    # Admin panel — all requests (rate-limited)
    location / {
        limit_req          zone=admin_limit burst=20 nodelay;
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
