  <circle cx="775" cy="408" r="26" fill="#c8956c"/>
  <rect x="752" y="432" width="46" height="56" rx="8" fill="#C8102E"/>
  <rect x="752" y="432" width="46" height="16" rx="6" fill="#e8304a"/>
