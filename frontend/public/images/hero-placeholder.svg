  <rect x="798" y="452" width="22" height="16" rx="3" fill="white" opacity="0.9"/>
  <rect x="800" y="454" width="10" height="12" rx="1" fill="#0B3D91" opacity="0.5"/>
  <!-- legs -->
  <rect x="758" y="485" width="12" height="30" rx="4" fill="#1F2A44"/>
  <rect x="776" y="485" width="12" height="30" rx="4" fill="#1F2A44"/>

  <!-- Student 3 — smaller, background -->
  <circle cx="850" cy="422" r="20" fill="#FDDBB4"/>
  <rect x="832" y="441" width="38" height="48" rx="7" fill="#1557b0"/>
  <rect x="832" y="441" width="38" height="14" rx="5" fill="#2a6dd9"/>
  <rect x="858" y="448" width="12" height="28" rx="4" fill="#0d2f6e"/>
  <rect x="838" y="487" width="10" height="24" rx="3" fill="#1F2A44"/>
  <rect x="853" y="487" width="10" height="24" rx="3" fill="#1F2A44"/>

  <!-- Path/walkway -->
  <ellipse cx="760" cy="510" rx="160" ry="18" fill="#d4c5a0" opacity="0.5"/>
  <rect x="630" y="495" width="260" height="20" rx="6" fill="#c8b890" opacity="0.4"/>

  <!-- Flower bed -->
  <ellipse cx="530" cy="488" rx="55" ry="10" fill="#4a9a4a" opacity="0.6"/>
  <circle cx="510" cy="483" r="5" fill="#FF6B6B" opacity="0.8"/>
  <circle cx="525" cy="480" r="4" fill="#FFD700" opacity="0.9"/>
  <circle cx="540" cy="484" r="5" fill="#FF6B6B" opacity="0.8"/>
  <circle cx="555" cy="481" r="4" fill="#FFB3C6" opacity="0.9"/>
  <circle cx="570" cy="485" r="4" fill="#FFD700" opacity="0.8"/>
</svg>