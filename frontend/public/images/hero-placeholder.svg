  <rect x="430" y="395" width="14" height="85" rx="4" fill="#6B4F2A"/>
  <ellipse cx="437" cy="370" rx="42" ry="54" fill="#2d7a2d" opacity="0.85"/>
  <ellipse cx="437" cy="355" rx="30" ry="38" fill="#3a8f3a" opacity="0.7"/>

  <rect x="545" y="415" width="12" height="65" rx="3" fill="#6B4F2A"/>
  <ellipse cx="551" cy="393" rx="34" ry="44" fill="#2d7a2d" opacity="0.8"/>

  <rect x="1080" y="405" width="12" height="75" rx="3" fill="#6B4F2A"/>
  <ellipse cx="1086" cy="380" rx="36" ry="48" fill="#2d7a2d" opacity="0.8"/>
  <ellipse cx="1086" cy="365" rx="25" ry="33" fill="#3a8f3a" opacity="0.65"/>

  <!-- Students (foreground, right-center) -->
  <!-- Student 1 — uniform navy+white -->
  <circle cx="700" cy="415" r="24" fill="#FDDBB4"/>
  <rect x="678" y="438" width="44" height="55" rx="8" fill="#0B3D91"/>
  <rect x="678" y="438" width="44" height="16" rx="6" fill="#1a56c4"/>
  <!-- bag -->
  <rect x="722" y="444" width="14" height="32" rx="5" fill="#0d2f6e"/>
  <!-- legs -->
  <rect x="684" y="490" width="12" height="28" rx="4" fill="#1F2A44"/>
  <rect x="702" y="490" width="12" height="28" rx="4" fill="#1F2A44"/>

